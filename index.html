<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Office Executive · Final Assessment</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #f2f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px 8px;
    }
    .app {
      max-width: 480px;
      width: 100%;
      background: white;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      padding: 20px 16px 28px;
      position: relative;
      transition: all 0.2s;
    }

    .admin-trigger {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      color: #475569;
      font-size: 18px;
      cursor: pointer;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
    }
    .admin-trigger:hover {
      background: #cbd5e1;
    }
    .admin-trigger:active {
      transform: scale(0.92);
    }

    .timer-fixed {
      position: sticky;
      top: 8px;
      z-index: 50;
      background: #1e293b;
      color: white;
      padding: 12px 18px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
      margin-bottom: 18px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .timer-label {
      font-size: 0.9rem;
      opacity: 0.8;
      letter-spacing: 0.5px;
    }
    #timerDisplay {
      font-family: monospace;
      font-size: 1.5rem;
      font-weight: 700;
      background: #0f172a;
      padding: 4px 14px;
      border-radius: 40px;
      color: #b9e6f0;
    }

    .admin-panel {
      display: none;
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      max-width: 450px;
      background: #1e293b;
      color: white;
      border-radius: 24px;
      padding: 22px 18px;
      z-index: 300;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid #475569;
      max-height: 85vh;
      overflow-y: auto;
    }
    .admin-panel.show {
      display: block;
    }
    .admin-panel h3 {
      font-size: 1.3rem;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-close {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
      padding: 0 8px;
    }
    .admin-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }
    .admin-entry {
      background: #0f172a;
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      border-left: 5px solid #3b82f6;
    }
    .admin-entry strong {
      color: #93c5fd;
    }

    .reg-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .reg-section h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0f172a;
      margin-top: 8px;
      letter-spacing: -0.5px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-group label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #334155;
    }
    .input-group input {
      padding: 14px 16px;
      border-radius: 18px;
      border: 1.5px solid #cbd5e1;
      font-size: 1rem;
      background: #f8fafc;
      transition: 0.2s;
    }
    .input-group input:focus {
      border-color: #2563eb;
      outline: none;
      background: white;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    .btn-primary {
      background: #2563eb;
      border: none;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 16px;
      border-radius: 40px;
      margin-top: 12px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 6px 14px rgba(37,99,235,0.3);
    }
    .btn-primary:active {
      transform: scale(0.97);
      background: #1d4ed8;
    }

    .quiz-section {
      display: none;
      flex-direction: column;
    }
    .quiz-section.active {
      display: flex;
    }
    .student-badge {
      background: #e2e8f0;
      padding: 10px 16px;
      border-radius: 40px;
      font-size: 0.9rem;
      margin-bottom: 16px;
      display: inline-block;
      align-self: flex-start;
      font-weight: 500;
      color: #1e293b;
    }
    .question-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      border: 1px solid #e9eef3;
    }
    .q-text {
      font-weight: 600;
      font-size: 1.05rem;
      color: #0b1a2e;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #f8fafc;
      border-radius: 16px;
      border: 1.5px solid transparent;
      transition: 0.1s;
      cursor: pointer;
      font-size: 0.98rem;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .option.selected {
      background: #dbeafe;
      border-color: #2563eb;
    }
    .option.correct-highlight {
      background: #dcfce7;
      border-color: #22c55e;
    }
    .option.wrong-highlight {
      background: #fee2e2;
      border-color: #ef4444;
    }
    .option input[type="radio"] {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #94a3b8;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: 0.1s;
      flex-shrink: 0;
    }
    .option input[type="radio"]:checked {
      border-color: #2563eb;
      background: #2563eb;
      box-shadow: inset 0 0 0 4px white;
    }
    .option.disabled {
      pointer-events: none;
      opacity: 0.9;
    }
    .marker {
      margin-left: auto;
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1;
    }
    .tick {
      color: #16a34a;
    }
    .cross {
      color: #dc2626;
    }

    .result-popup {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 400;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .result-popup.show {
      display: flex;
    }
    .popup-card {
      background: white;
      max-width: 380px;
      width: 100%;
      padding: 28px 22px;
      border-radius: 36px;
      text-align: center;
      box-shadow: 0 30px 50px rgba(0,0,0,0.3);
    }
    .popup-card h2 {
      font-size: 1.8rem;
      margin-bottom: 6px;
      color: #0f172a;
    }
    .popup-card .grade {
      font-size: 3rem;
      font-weight: 800;
      margin: 10px 0;
      letter-spacing: 2px;
    }
    .popup-card .score {
      font-size: 1.3rem;
      color: #334155;
      margin-bottom: 10px;
    }
    .popup-card .info {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 24px;
      margin: 12px 0 6px;
      font-size: 0.95rem;
    }
    .popup-close {
      margin-top: 18px;
      background: #0f172a;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }

    .submit-btn {
      background: #0f172a;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app" id="appContainer">
    <button class="admin-trigger" id="adminTrigger" aria-label="Admin">⚙️</button>

    <div class="admin-panel" id="adminPanel">
      <h3>📋 Admin · Submissions <button class="admin-close" id="adminClose">×</button></h3>
      <div id="adminList" class="admin-list">
        <p style="opacity:0.7; font-size:0.9rem;">No submissions yet.</p>
      </div>
    </div>

    <div class="timer-fixed" id="timerFixed" style="display: none;">
      <span class="timer-label">⏳ TIME LEFT</span>
      <span id="timerDisplay">30:00</span>
    </div>

    <div class="reg-section" id="regSection">
      <h2>Office Executive<br>Final Assessment</h2>
      <p style="color:#475569; margin-bottom:8px;">Please fill your details</p>
      <div class="input-group">
        <label>Full name</label>
        <input type="text" id="regName" autocomplete="off">
      </div>
      <div class="input-group">
        <label>Phone number</label>
        <input type="tel" id="regPhone" autocomplete="off">
      </div>
      <div class="input-group">
        <label>Registration number</label>
        <input type="text" id="regRegNo" autocomplete="off">
      </div>
      <button class="btn-primary" id="startBtn">Start Assessment →</button>
    </div>

    <div class="quiz-section" id="quizSection">
      <div class="student-badge" id="studentBadge"></div>
      <div id="questionsContainer"></div>
      <button class="btn-primary submit-btn" id="submitBtn">Submit final answers</button>
    </div>
  </div>

  <div class="result-popup" id="resultPopup">
    <div class="popup-card">
      <h2 id="popupName">—</h2>
      <div class="grade" id="popupGrade">—</div>
      <div class="score" id="popupScore">0 / 50</div>
      <div class="info" id="popupInfo"></div>
      <button class="popup-close" id="popupClose">Close</button>
    </div>
  </div>

  <script>
    (function() {
      const questions = [
        // MS Word (1-15)
        { q: "What is the default file extension for a Microsoft Word document?", options: [".docx", ".txt", ".pdf", ".xlsx"], answer: 0 },
        { q: "Which shortcut is used to save a document in MS Word?", options: ["Ctrl+S", "Ctrl+P", "Ctrl+Z", "Ctrl+C"], answer: 0 },
        { q: "What does the 'Ruler' in MS Word help with?", options: ["Setting margins and indents", "Changing font color", "Inserting images", "Checking spelling"], answer: 0 },
        { q: "Which tab contains the 'Font' group in MS Word?", options: ["Home", "Insert", "Review", "View"], answer: 0 },
        { q: "What is the shortcut for 'Undo' in MS Word?", options: ["Ctrl+Z", "Ctrl+Y", "Ctrl+U", "Ctrl+X"], answer: 0 },
        { q: "Which feature is used to check spelling and grammar?", options: ["Review > Spelling & Grammar", "Home > Font", "Insert > Table", "View > Zoom"], answer: 0 },
        { q: "What does 'Ctrl+B' do in MS Word?", options: ["Bold text", "Bullet list", "Break page", "Bookmark"], answer: 0 },
        { q: "Which key combination selects all text in a document?", options: ["Ctrl+A", "Ctrl+S", "Ctrl+D", "Ctrl+F"], answer: 0 },
        { q: "What is a 'Header' in MS Word?", options: ["Text at the top of every page", "Text at the bottom", "A type of font", "A page border"], answer: 0 },
        { q: "Which view shows how the document will look when printed?", options: ["Print Layout", "Draft", "Web Layout", "Outline"], answer: 0 },
        { q: "What does 'Ctrl+P' do in MS Word?", options: ["Print", "Paste", "Preview", "Page break"], answer: 0 },
        { q: "Which feature adds numbered or bulleted lists?", options: ["Home > Paragraph group", "Insert > Shapes", "Review > Comments", "View > Ruler"], answer: 0 },
        { q: "What is the shortcut for 'Find' in MS Word?", options: ["Ctrl+F", "Ctrl+H", "Ctrl+G", "Ctrl+R"], answer: 0 },
        { q: "Which option changes the page orientation to landscape?", options: ["Layout > Orientation", "Home > Font", "Insert > Picture", "Review > Track Changes"], answer: 0 },
        { q: "What is a 'footer' in MS Word?", options: ["Text at the bottom of every page", "Text at the top", "A type of table", "A page margin"], answer: 0 },

        // MS Excel (16-30)
        { q: "What is the default file extension for an Excel workbook?", options: [".xlsx", ".docx", ".pptx", ".csv"], answer: 0 },
        { q: "Which symbol starts a formula in Excel?", options: ["=", "+", "-", "@"], answer: 0 },
        { q: "What is the shortcut to insert a new row in Excel?", options: ["Ctrl+Shift+'+'", "Ctrl+R", "Alt+N", "Shift+Insert"], answer: 0 },
        { q: "Which function adds a range of cells in Excel?", options: ["SUM", "ADD", "TOTAL", "PLUS"], answer: 0 },
        { q: "What does 'Ctrl+C' do in Excel?", options: ["Copy", "Cut", "Paste", "Clear"], answer: 0 },
        { q: "Which tab is used to create charts in Excel?", options: ["Insert", "Home", "Data", "Review"], answer: 0 },
        { q: "What is a 'cell' in Excel?", options: ["Intersection of a row and column", "A graph", "A sheet name", "A formula bar"], answer: 0 },
        { q: "Which function finds the average of numbers?", options: ["AVERAGE", "MEAN", "AVG", "MID"], answer: 0 },
        { q: "What is the shortcut to save an Excel file?", options: ["Ctrl+S", "Ctrl+V", "Ctrl+Z", "Ctrl+N"], answer: 0 },
        { q: "Which feature freezes rows/columns while scrolling?", options: ["Freeze Panes", "Split", "Lock Cell", "Filter"], answer: 0 },
        { q: "What does '###' in a cell indicate?", options: ["Column is too narrow", "Formula error", "Text overflow", "Empty cell"], answer: 0 },
        { q: "Which function counts the number of cells with numbers?", options: ["COUNT", "COUNTA", "SUM", "TOTAL"], answer: 0 },
        { q: "What is a 'workbook' in Excel?", options: ["A file containing multiple sheets", "A single sheet", "A chart", "A formula"], answer: 0 },
        { q: "Which shortcut opens the 'Format Cells' dialog?", options: ["Ctrl+1", "Ctrl+2", "Ctrl+3", "Ctrl+4"], answer: 0 },
        { q: "What does the 'IF' function do in Excel?", options: ["Tests a condition and returns values", "Adds numbers", "Formats text", "Sorts data"], answer: 0 },

        // MS PowerPoint (31-42)
        { q: "What is the default file extension for a PowerPoint presentation?", options: [".pptx", ".docx", ".xlsx", ".txt"], answer: 0 },
        { q: "Which view is used to display slides in full screen?", options: ["Slide Show", "Normal", "Outline", "Notes"], answer: 0 },
        { q: "What is the shortcut to start a slideshow from the beginning?", options: ["F5", "F1", "F2", "F3"], answer: 0 },
        { q: "Which feature adds visual effects between slides?", options: ["Transitions", "Animations", "Themes", "Layouts"], answer: 0 },
        { q: "What is a 'slide master' in PowerPoint?", options: ["Controls the overall design of slides", "A single slide", "A type of chart", "A speaker note"], answer: 0 },
        { q: "Which tab is used to insert a picture in PowerPoint?", options: ["Insert", "Home", "Design", "Transitions"], answer: 0 },
        { q: "What does 'Ctrl+M' do in PowerPoint?", options: ["New slide", "New presentation", "Move slide", "Mute"], answer: 0 },
        { q: "Which feature animates individual objects on a slide?", options: ["Animations", "Transitions", "Slide Master", "Notes Page"], answer: 0 },
        { q: "What is the purpose of 'Speaker Notes' in PowerPoint?", options: ["To add notes for the presenter", "To add audio", "To add images", "To change slide size"], answer: 0 },
        { q: "Which shortcut starts the slideshow from the current slide?", options: ["Shift+F5", "F5", "Ctrl+F5", "Alt+F5"], answer: 0 },
        { q: "What is a 'theme' in PowerPoint?", options: ["A set of colors, fonts and effects", "A single slide", "A transition", "A type of chart"], answer: 0 },
        { q: "Which view shows thumbnails of all slides?", options: ["Slide Sorter", "Normal", "Reading View", "Outline"], answer: 0 },

        // Basic Internet (43-50)
        { q: "What does 'WWW' stand for?", options: ["World Wide Web", "World Web Wide", "Wide World Web", "Web World Wide"], answer: 0 },
        { q: "What is a web browser?", options: ["Software to access the internet", "A type of cable", "A search engine", "An email address"], answer: 0 },
        { q: "Which of these is a search engine?", options: ["Google", "Windows", "Excel", "Word"], answer: 0 },
        { q: "What does 'URL' stand for?", options: ["Uniform Resource Locator", "Universal Reference Link", "Uniform Reference Locator", "Universal Resource Link"], answer: 0 },
        { q: "What is an IP address?", options: ["A unique number assigned to a device on a network", "A website name", "An email password", "A type of browser"], answer: 0 },
        { q: "What does 'HTTPS' indicate in a web address?", options: ["Secure connection", "Slow connection", "Hyperlink", "File download"], answer: 0 },
        { q: "What is 'cloud computing'?", options: ["Using services over the internet", "Storing files on a USB", "A type of weather app", "A printer feature"], answer: 0 },
        { q: "Which of these is a common email service?", options: ["Gmail", "Excel", "Word", "PowerPoint"], answer: 0 }
      ];

      // ---------- PERSISTENT STORAGE KEY ----------
      const STORAGE_KEY = 'officeExecSubmissions';

      // Load existing submissions from localStorage
      let adminSubmissions = [];
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) adminSubmissions = JSON.parse(stored);
      } catch (e) {
        adminSubmissions = [];
      }

      let student = { name: '', phone: '', regNo: '' };
      let userAnswers = new Array(50).fill(null);
      let quizActive = false;
      let timerInterval = null;
      let timeLeft = 30 * 60;
      let submitted = false;

      const regSection = document.getElementById('regSection');
      const quizSection = document.getElementById('quizSection');
      const startBtn = document.getElementById('startBtn');
      const questionsContainer = document.getElementById('questionsContainer');
      const submitBtn = document.getElementById('submitBtn');
      const studentBadge = document.getElementById('studentBadge');
      const timerFixed = document.getElementById('timerFixed');
      const timerDisplay = document.getElementById('timerDisplay');
      const resultPopup = document.getElementById('resultPopup');
      const popupName = document.getElementById('popupName');
      const popupGrade = document.getElementById('popupGrade');
      const popupScore = document.getElementById('popupScore');
      const popupInfo = document.getElementById('popupInfo');
      const popupClose = document.getElementById('popupClose');
      const adminTrigger = document.getElementById('adminTrigger');
      const adminPanel = document.getElementById('adminPanel');
      const adminClose = document.getElementById('adminClose');
      const adminList = document.getElementById('adminList');

      // ---------- Save submissions to localStorage ----------
      function saveSubmissions() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(adminSubmissions));
        } catch (e) {
          console.warn('Could not save to localStorage', e);
        }
      }

      function renderQuestions() {
        let html = '';
        questions.forEach((q, idx) => {
          html += `<div class="question-card" data-qidx="${idx}">
            <div class="q-text">${idx+1}. ${q.q}</div>
            <div class="options">`;
          q.options.forEach((opt, optIdx) => {
            const letter = String.fromCharCode(65 + optIdx);
            html += `<label class="option" data-qidx="${idx}" data-optidx="${optIdx}">
              <input type="radio" name="q${idx}" value="${optIdx}" ${userAnswers[idx] === optIdx ? 'checked' : ''}>
              <span>${letter}. ${opt}</span>
              <span class="marker" id="marker-${idx}-${optIdx}"></span>
            </label>`;
          });
          html += `</div></div>`;
        });
        questionsContainer.innerHTML = html;

        document.querySelectorAll('.option').forEach(optEl => {
          optEl.addEventListener('click', function(e) {
            if (!quizActive || submitted) return;
            const qidx = parseInt(this.dataset.qidx);
            const optidx = parseInt(this.dataset.optidx);
            if (userAnswers[qidx] !== null) return;
            const parentCard = this.closest('.question-card');
            parentCard.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            this.classList.add('selected');
            this.querySelector('input[type="radio"]').checked = true;
            userAnswers[qidx] = optidx;
          });
        });
      }

      function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            if (quizActive && !submitted) autoSubmit();
            return;
          }
          timeLeft--;
          updateTimerDisplay();
        }, 1000);
        updateTimerDisplay();
      }

      function updateTimerDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
      }

      function stopTimer() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      }

      function startAssessment() {
        const name = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const regNo = document.getElementById('regRegNo').value.trim();
        if (!name || !phone || !regNo) { alert('Please fill all fields (name, phone, registration no.)'); return; }
        student = { name, phone, regNo };
        studentBadge.textContent = `👤 ${name} · ${regNo}`;
        userAnswers = new Array(50).fill(null);
        submitted = false;
        timeLeft = 30 * 60;
        regSection.style.display = 'none';
        quizSection.classList.add('active');
        timerFixed.style.display = 'flex';
        quizActive = true;
        renderQuestions();
        document.querySelectorAll('.marker').forEach(m => m.textContent = '');
        document.querySelectorAll('.option').forEach(o => {
          o.classList.remove('correct-highlight', 'wrong-highlight', 'disabled');
        });
        startTimer();
      }

      function autoSubmit() {
        if (submitted) return;
        submitted = true; quizActive = false; stopTimer(); finalizeAssessment(true);
      }

      function manualSubmit() {
        if (submitted || !quizActive) return;
        submitted = true; quizActive = false; stopTimer(); finalizeAssessment(false);
      }

      function finalizeAssessment(isAuto) {
        document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));
        let score = 0;
        const total = 50;
        questions.forEach((q, idx) => {
          const userAns = userAnswers[idx];
          const correctAns = q.answer;
          const isCorrect = (userAns === correctAns);
          if (isCorrect) score++;
          const correctOption = document.querySelector(`.option[data-qidx="${idx}"][data-optidx="${correctAns}"]`);
          if (correctOption) {
            correctOption.classList.add('correct-highlight');
            const marker = document.getElementById(`marker-${idx}-${correctAns}`);
            if (marker) { marker.innerHTML = '✓'; marker.classList.add('tick'); }
          }
          if (userAns !== null && userAns !== correctAns) {
            const wrongOption = document.querySelector(`.option[data-qidx="${idx}"][data-optidx="${userAns}"]`);
            if (wrongOption) {
              wrongOption.classList.add('wrong-highlight');
              const marker = document.getElementById(`marker-${idx}-${userAns}`);
              if (marker) { marker.innerHTML = '✗'; marker.classList.add('cross'); }
            }
          }
        });
        let grade = 'No Grade';
        if (score >= 40 && score <= 50) grade = 'A+';
        else if (score >= 30 && score <= 39) grade = 'A';
        else grade = 'No Grade';
        popupName.textContent = student.name;
        popupGrade.textContent = grade;
        popupGrade.style.color = grade === 'A+' ? '#16a34a' : (grade === 'A' ? '#2563eb' : '#b91c1c');
        popupScore.textContent = `${score} / 50`;
        popupInfo.innerHTML = `📞 ${student.phone} · 🆔 ${student.regNo} ${isAuto ? '· ⏰ auto-submitted' : ''}`;
        resultPopup.classList.add('show');

        // Push to array and SAVE to localStorage
        adminSubmissions.push({
          name: student.name, phone: student.phone, regNo: student.regNo,
          score: score, grade: grade, auto: isAuto,
          timestamp: new Date().toLocaleString()
        });
        saveSubmissions();   // <-- persist to localStorage
        updateAdminList();
      }

      function updateAdminList() {
        if (adminSubmissions.length === 0) {
          adminList.innerHTML = '<p style="opacity:0.7; font-size:0.9rem;">No submissions yet.</p>';
          return;
        }
        let html = '';
        adminSubmissions.slice().reverse().forEach((s) => {
          html += `<div class="admin-entry">
            <strong>${s.name}</strong> (${s.regNo})<br>
            📞 ${s.phone} · Score: ${s.score}/50 · Grade: ${s.grade}<br>
            <span style="opacity:0.6; font-size:0.75rem;">${s.timestamp} ${s.auto ? '· auto' : ''}</span>
          </div>`;
        });
        adminList.innerHTML = html;
      }

      // ---- event listeners ----
      startBtn.addEventListener('click', startAssessment);
      submitBtn.addEventListener('click', manualSubmit);
      popupClose.addEventListener('click', function() {
        resultPopup.classList.remove('show');
        location.reload();
      });

      adminTrigger.addEventListener('click', function(e) {
        e.stopPropagation();
        const pwd = prompt('Enter admin password:');
        if (pwd === 'a') {
          // reload from localStorage in case another tab added entries
          try {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) adminSubmissions = JSON.parse(stored);
          } catch (err) {}
          updateAdminList();
          adminPanel.classList.add('show');
        } else if (pwd !== null) {
          alert('Wrong password');
        }
      });

      adminClose.addEventListener('click', function() {
        adminPanel.classList.remove('show');
      });

      document.addEventListener('click', function(e) {
        if (adminPanel.classList.contains('show') && !adminPanel.contains(e.target) && e.target !== adminTrigger) {
          adminPanel.classList.remove('show');
        }
      });

      updateAdminList();
    })();
  </script>
</body>
</html>
